[package]
name = "mi_thermald"
version = "2.1.0"
edition = "2021"

[dependencies]
aes = "0.8"
cbc = "0.1"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
